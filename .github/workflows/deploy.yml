name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare SPA routes
        run: |
          mkdir -p dist/zzz-damage-calculator
          mkdir -p dist/zzz-build-creator
          mkdir -p dist/zzz-build-manager
          mkdir -p dist/zzz-disc-inventory
          mkdir -p dist/info-settings

          cp dist/index.html dist/zzz-damage-calculator/index.html
          cp dist/index.html dist/zzz-build-creator/index.html
          cp dist/index.html dist/zzz-build-manager/index.html
          cp dist/index.html dist/zzz-disc-inventory/index.html
          cp dist/index.html dist/info-settings/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        uses: actions/deploy-pages@v4
