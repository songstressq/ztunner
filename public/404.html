<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const search = window.location.search;

      const redirect = path + search;

      window.location.replace("/?redirect=" + encodeURIComponent(redirect));
    </script>
  </head>
  <body></body>
</html>
